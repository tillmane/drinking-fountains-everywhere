<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seattle Drinking Fountains</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Big+Shoulders+Inline:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ─── Hamburger drawer ──────────────────────────────────── -->

  <div id="menu-overlay"></div>

  <div id="menu-drawer">
    <button id="menu-close-btn" aria-label="Close menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <nav id="menu-nav">
      <button class="menu-item menu-item-about" data-modal="about">About Fountains For All</button>
      <div class="menu-divider"></div>
      <button class="menu-item" data-modal="terms">Terms of Use</button>
      <button class="menu-item" data-modal="privacy">Privacy Policy</button>
      <button class="menu-item" data-modal="copyright">Copyright</button>
      <div class="menu-divider"></div>
      <button class="menu-item" id="menu-admin-btn">Admin Mode</button>
      <a class="menu-item menu-item-dashboard hidden" id="menu-dashboard-link" href="dashboard.html">Contribution Dashboard</a>
    </nav>
  </div>

  <!-- ─── Content modals ───────────────────────────────────── -->

  <div id="content-modal" class="hidden">
    <div id="content-modal-box" class="modal-box">
      <div id="content-modal-header" class="modal-header">
        <span id="content-modal-title" class="modal-title"></span>
        <button id="content-modal-close" class="modal-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="content-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- ─── Branding bar ────────────────────────────────────────── -->

  <div id="branding-bar">
    <button id="hamburger-btn" aria-label="Menu" title="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <span id="branding-title">Fountains For All</span>

    <div id="branding-actions">
      <button id="toolbar-toggle-btn" class="active" aria-label="Search and filters" title="Search and filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button id="legend-toggle-btn" aria-label="Legend" title="Legend">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="4" height="4" rx="1"/>
          <line x1="10" y1="6" x2="21" y2="6"/>
          <rect x="3" y="11" width="4" height="4" rx="1"/>
          <line x1="10" y1="13" x2="21" y2="13"/>
          <rect x="3" y="18" width="4" height="4" rx="1"/>
          <line x1="10" y1="20" x2="21" y2="20"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ─── Collapsible toolbar ──────────────────────────────────── -->

  <div id="controls-bar">

    <form id="search-form">
      <input
        id="search-input"
        type="text"
        placeholder="Search address or landmark"
        autocomplete="off"
        enterkeyhint="search"
      >
      <button type="submit" id="search-btn" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

    <div id="filter-pills">
      <button class="filter-pill" data-filter="accessible" aria-label="Accessible" title="Accessible">
        <svg fill="currentColor" width="14px" height="14px" viewBox="0 0 0.42 0.42" xmlns="http://www.w3.org/2000/svg"><path d="M0.21 0.114a0.035 0.035 0 1 0 -0.035 -0.035 0.035 0.035 0 0 0 0.035 0.035m0.131 0.245h-0.018v-0.088a0.018 0.018 0 0 0 -0.018 -0.018h-0.088v-0.035h0.088a0.018 0.018 0 0 0 0 -0.035h-0.088v-0.035a0.018 0.018 0 0 0 -0.035 0v0.123a0.018 0.018 0 0 0 0.018 0.018h0.088v0.088a0.018 0.018 0 0 0 0.018 0.018h0.035a0.018 0.018 0 0 0 0 -0.035m-0.119 -0.028a0.07 0.07 0 0 1 -0.126 -0.042 0.07 0.07 0 0 1 0.042 -0.064A0.018 0.018 0 1 0 0.124 0.193a0.105 0.105 0 1 0 0.126 0.159 0.018 0.018 0 0 0 -0.028 -0.021"/></svg>
        Accessible
      </button>
      <button class="filter-pill" data-filter="bottle" aria-label="Bottle filler" title="Bottle filler">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2h8"/>
          <path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2"/>
        </svg>
        Bottle Filler
      </button>
      <button class="filter-pill" data-filter="dog" aria-label="Dog bowl" title="Dog bowl">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 5.172C10 3.782 8.423 2.679 6.5 3c-2.823.47-4.113 6.006-4 7 .08.703 1.725 1 3.5 1C7.555 11 10 10.5 10 10"/>
          <path d="M14.5 5.172c0-1.39 1.577-2.493 3.5-2.172 2.823.47 4.113 6.006 4 7-.08.703-1.725 1-3.5 1-1.555 0-4-.5-4-1"/>
          <path d="M8 14v.5"/>
          <path d="M16 14v.5"/>
          <path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/>
          <path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444c0-1.061-.162-2.2-.493-3.309"/>
        </svg>
        Dog Bowl
      </button>
    </div>

    <button id="toolbar-close-btn" aria-label="Close toolbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

  </div>

  <!-- ─── Legend panel ──────────────────────────────────────────── -->

  <div id="legend-panel" class="hidden">
    <div id="legend-panel-header">
      <span>Legend</span>
      <button id="legend-panel-close" aria-label="Close legend">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="legend-row">
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.27 21.73 0 14 0z" fill="#9e9e9e" stroke="#fff" stroke-width="1.5"/><text x="14" y="19" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="Arial, sans-serif">?</text></svg>
      Not yet rated
    </div>
    <div class="legend-row">
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.27 21.73 0 14 0z" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="14" y="20" text-anchor="middle" font-size="14" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">👍</text></svg>
      Mostly 👍
    </div>
    <div class="legend-row">
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.27 21.73 0 14 0z" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="14" y="20" text-anchor="middle" font-size="14" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">👎</text></svg>
      Mostly 👎
    </div>
    <div class="legend-row">
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.27 21.73 0 14 0z" fill="#c62828" stroke="#fff" stroke-width="1.5"/><line x1="9" y1="10" x2="19" y2="20" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/><line x1="19" y1="10" x2="9" y2="20" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/></svg>
      Shut off
    </div>
    <div class="legend-row">
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.27 21.73 0 14 0z" fill="#e67e22" stroke="#fff" stroke-width="1.5"/><line x1="9" y1="10" x2="19" y2="20" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/><line x1="19" y1="10" x2="9" y2="20" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/></svg>
      Reported off
    </div>
    <div class="legend-row">
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.27 21.73 0 14 0z" fill="#e67e22" stroke="#fff" stroke-width="1.5"/><text x="14" y="19" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="Arial, sans-serif" opacity="0.9">?</text></svg>
      Reported not found / decommissioned
    </div>
    <div class="legend-row legend-admin-row hidden">
      <svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.27 21.73 0 14 0z" fill="#0891b2" stroke="#fff" stroke-width="1.5"/><text x="14" y="19" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="Arial, sans-serif">?</text></svg>
      OpenStreetMap
    </div>
  </div>

  <div id="confirm-modal" class="hidden">
    <div id="confirm-modal-box">
      <div id="confirm-message"></div>
      <div id="confirm-modal-actions">
        <button id="confirm-cancel-btn">Cancel</button>
        <button id="confirm-ok-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div id="pin-modal" class="hidden">
    <div id="pin-modal-box">
      <div id="pin-modal-title">Admin PIN</div>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="16" autocomplete="off" placeholder="Enter PIN">
      <div id="pin-error" class="hidden">Incorrect PIN</div>
      <div id="pin-modal-actions">
        <button id="pin-cancel-btn">Cancel</button>
        <button id="pin-submit-btn">Unlock</button>
      </div>
    </div>
  </div>

  <div id="welcome-modal" class="hidden">
    <div id="welcome-modal-box" class="modal-box">
      <div id="welcome-modal-header" class="modal-header">
        <span id="welcome-modal-title" class="modal-title">Welcome to Fountains For All!</span>
        <button id="welcome-modal-close" class="modal-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="welcome-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="fountain-count"></div>

  <button id="feedback-btn" aria-label="Give feedback">💬 Share your feedback!</button>

  <div id="layer-control" class="hidden">
    <div id="layer-control-header">Layers</div>
    <button class="layer-toggle active" data-source="city">
      <span class="layer-swatch city"></span> Seattle City GIS
    </button>
    <button class="layer-suboption" data-option="city-unique">
      <span class="checkbox"></span> Show only those not in OSM
    </button>
    <button class="layer-toggle active" data-source="osm">
      <span class="layer-swatch osm"></span> OpenStreetMap
    </button>
    <hr class="layer-control-divider">
    <div id="layer-control-header">Rating</div>
    <button class="layer-suboption" data-option="rated">
      <span class="checkbox"></span> Rated <span class="rating-filter-count" id="count-rated"></span>
    </button>
    <button class="layer-suboption" data-option="unrated">
      <span class="checkbox"></span> Unrated <span class="rating-filter-count" id="count-unrated"></span>
    </button>
    <button class="layer-suboption" data-option="rated-7d">
      <span class="checkbox"></span> Rated past 7 days <span class="rating-filter-count" id="count-rated-7d"></span>
    </button>
    <hr class="layer-control-divider">
    <div id="layer-control-header">Not Found / Decommissioned</div>
    <button class="layer-suboption" data-option="not-found">
      <span class="checkbox"></span> Show Not Found / Decommissioned <span class="rating-filter-count" id="count-not-found"></span>
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
